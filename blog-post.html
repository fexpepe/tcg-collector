<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <!-- Base na raiz: esta casca é servida em /blog/<slug> pela Function
         (functions/blog/[slug].js). Sem isto, os assets relativos (src/*,
         styles) resolveriam em /blog/... e quebrariam. As âncoras do post
         (#secao) saem do renderizador já com o caminho do post na frente —
         com a base, um "#x" sozinho levaria pra home. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Blog - Sleevu</title>
    <!-- A Function troca título, descrição, canonical e Open Graph pelos do post
         e TIRA este noindex. Ele só fica quando a casca sai crua (endereço
         /blog-post direto, ou Supabase fora — aí a página vem com 503). -->
    <meta name="robots" content="noindex">
    <meta name="description" content="Artigo do blog do Sleevu.">
    <link rel="canonical" href="https://sleevu.app/blog">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/blog">
    <meta property="og:title" content="Blog - Sleevu">
    <meta property="og:description" content="Artigo do blog do Sleevu.">
    <meta property="og:image" content="https://sleevu.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog - Sleevu">
    <meta name="twitter:description" content="Artigo do blog do Sleevu.">
    <meta name="twitter:image" content="https://sleevu.app/og-image.png">
    <link rel="alternate" type="application/rss+xml" title="Blog do Sleevu" href="/blog/feed.xml">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Saída de emergência: só aparece se o app não subir (ver .falha-boot no
         styles.css). Sem o "Tentar de novo": com o <base href="/"> desta página
         o href="" levaria pro início, não pra esta tela. -->
    <div class="falha-boot" hidden>
      <p data-i18n="boot.stuck">Esta tela não terminou de carregar.</p>
      <a class="primary" href="/" data-i18n="boot.home">Ir para o início</a>
    </div>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" data-i18n-aria="aria.pages" aria-label="Páginas" data-active-page="blog"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main class="blog-page blog-post-page">
      <!-- Só pra quem é editor do blog (o src/blog.js pergunta ao banco). -->
      <a class="blog-manage blog-manage--post" href="blog-editor" data-blog-manage hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span data-i18n="blog.editPost">Editar este post</span>
      </a>
      <!-- A borda põe o artigo aqui. Vazio = a Function não conseguiu (ou a
           casca foi aberta direto): o src/blog.js busca o post do navegador. -->
      <div id="blogPost" class="blog-post-root">
        <p class="empty-state" data-i18n="blog.loading">Carregando…</p>
      </div>
      <script type="application/json" id="blogPostData"></script>
    </main>

    <script defer src="src/i18n.js"></script>
    <script defer src="src/i18n-blog.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/blog-render.js"></script>
    <script defer src="src/blog.js"></script>
  </body>
</html>
