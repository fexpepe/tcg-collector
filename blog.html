<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="blog.title">Blog - Sleevu</title>
    <meta name="description" content="Guias, mercado e história das cartas colecionáveis: artigos do Sleevu sobre Pokémon, One Piece, Magic, Lorcana e mais.">
    <link rel="canonical" href="https://sleevu.app/blog">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/blog">
    <meta property="og:title" content="Blog - Sleevu">
    <meta property="og:description" content="Guias, mercado e história das cartas colecionáveis: artigos do Sleevu sobre Pokémon, One Piece, Magic, Lorcana e mais.">
    <meta property="og:image" content="https://sleevu.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog - Sleevu">
    <meta name="twitter:description" content="Guias, mercado e história das cartas colecionáveis: artigos do Sleevu sobre Pokémon, One Piece, Magic, Lorcana e mais.">
    <meta name="twitter:image" content="https://sleevu.app/og-image.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Saída de emergência: só aparece se o app não subir (ver .falha-boot no styles.css). -->
    <div class="falha-boot" hidden>
      <p data-i18n="boot.stuck">Esta tela não terminou de carregar.</p>
      <a class="primary" href="" data-i18n="boot.retry">Tentar de novo</a>
      <a class="secondary" href="/" data-i18n="boot.home">Ir para o início</a>
    </div>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" data-i18n-aria="aria.pages" aria-label="Páginas" data-active-page="blog"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main class="blog-page">
      <div class="page-head blog-head">
        <div class="blog-head-text">
          <h1 data-i18n="blog.heading">Blog</h1>
          <p class="page-head-sub" data-i18n="blog.sub">Guias, mercado e a história das cartas — escrito por quem coleciona.</p>
        </div>
        <!-- Só pra quem é editor do blog (o src/blog.js pergunta ao banco). -->
        <a class="blog-manage" href="blog-editor" data-blog-manage hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span data-i18n="blog.manage">Escrever e editar</span>
        </a>
      </div>

      <!-- Filtros: categoria em pílulas (rolam de lado no celular) e jogo num
           seletor (são 14 jogos — pílula pra cada um não cabe). O src/blog.js
           monta as opções e filtra sem recarregar. -->
      <div class="blog-filters" id="blogFilters" hidden>
        <div class="blog-cats" id="blogCats" role="group" data-i18n-aria="blog.catsLabel" aria-label="Categorias"></div>
        <label class="blog-game-filter">
          <span class="sr-only" data-i18n="blog.gameLabel">Jogo</span>
          <select id="blogGame" class="lang-select"></select>
        </label>
      </div>
      <p class="blog-active-tag" id="blogTag" hidden></p>

      <!-- A borda (functions/blog/index.js) põe os cartões aqui; sem ela (dev
           local, Supabase fora na hora do build da página), o src/blog.js busca. -->
      <section id="blogList" class="blog-list" aria-live="polite">
        <p class="empty-state" data-i18n="blog.loading">Carregando…</p>
      </section>
      <div class="blog-more-wrap">
        <button type="button" class="lst-mini blog-more" id="blogMore" hidden data-i18n="blog.more">Carregar mais</button>
      </div>
      <script type="application/json" id="blogData"></script>
    </main>

    <script defer src="src/i18n.js"></script>
    <script defer src="src/i18n-blog.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/blog-render.js"></script>
    <script defer src="src/blog.js"></script>
  </body>
</html>
