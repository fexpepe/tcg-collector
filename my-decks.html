<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title.myDecks">Meus Decks - Sleevu</title>
    <meta name="description" content="Seus decks no Sleevu: os que você criou e os que salvou da comunidade, com custo total e o que falta comprar.">
    <!-- Página PESSOAL: fora do índice (a galeria pública é a decks.html). -->
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://sleevu.app/my-decks">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" data-i18n-aria="aria.pages" aria-label="Páginas" data-active-page="mydecks"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>
      <div class="page-head dash-head">
        <h1 data-i18n="decks.myHeading">Meus Decks</h1>
        <a href="dashboard" class="serie-back" data-i18n="nav.backDashboard">← Hub</a>
      </div>

      <!-- Galeria (sem ?id=) e editor (com ?id=) — decks.js alterna. -->
      <div id="deckGallery"></div>
      <div id="deckEditor" hidden></div>
    </main>

    <script defer src="src/i18n.js"></script>
    <!-- Textos dos decks: fora do i18n.js pra as outras paginas nao carregarem 20 KB a toa. -->
    <script defer src="src/i18n-decks.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/deck-rules.js"></script>
    <script defer src="src/decks.js"></script>
  </body>
</html>
