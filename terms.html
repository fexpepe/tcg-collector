    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="index.html">Sleevu</a>
        <nav class="page-nav" aria-label="Páginas" data-active-page="terms"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>
      <div class="page-head">
        <h1 data-i18n="terms.heading">Termos de Uso</h1>
      </div>
      <p class="collection-subtitle" data-i18n="terms.updated">Última atualização: junho de 2026.</p>

      <article class="legal">
        <section data-i18n-html="terms.s.intro"></section>
        <section data-i18n-html="terms.s.account"></section>
        <section data-i18n-html="terms.s.use"></section>
        <section data-i18n-html="terms.s.content"></section>
        <!-- id: alvo do link "Marcas" do rodapé. -->
        <section id="marcas" data-i18n-html="terms.s.ip"></section>
        <section data-i18n-html="terms.s.data"></section>
        <section data-i18n-html="terms.s.warranty"></section>
        <section data-i18n-html="terms.s.liability"></section>
        <section data-i18n-html="terms.s.donations"></section>
        <section data-i18n-html="terms.s.changes"></section>
        <section data-i18n-html="terms.s.law"></section>
        <section data-i18n-html="terms.s.contact"></section>
      </article>
    </main>

    <script defer src="src/i18n.js"></script>
    <!-- Textos longos desta pagina (privacidade/termos/sobre/ajuda/faq): fora do
         i18n.js pra as outras paginas nao carregarem 39 KB a toa. -->
    <script defer src="src/i18n-docs.js"></script>
    <script defer src="src/shared.js"></script>
  </body>
</html>
