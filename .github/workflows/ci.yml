name: CI (testes + checks)

# Portão de qualidade rápido (< 1 min), separado do deploy: roda em TODO push e
# PR, sem tocar produção. O deploy continua sendo o pipeline pesado da main.
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "data/sets/**" # snapshot automático do catálogo não precisa de CI
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Testes unitários (node:test)
        run: node --test tests/*.test.mjs

      - name: Testes do merge de sync (LWW + tombstones)
        run: node scripts/test-sync-merge.mjs

      - name: Smoke estático (sintaxe + i18n pt/en + ordem de scripts)
        run: node scripts/check.mjs

      # Guardas de mobile: reset de mídia, overflow-x, fonte 16px no toque e
      # aria-pressed em link. São regras que já quebraram aqui e cujo sintoma
      # (layout estourado no celular) não aparece em teste de unidade.
      - name: Guardas de layout mobile
        run: node scripts/check-mobile.mjs

      # As páginas carregam FATIAS do índice (indexes-sets.js etc.), não o
      # indexes.js inteiro. Se alguém regenerar o indexes.js e esquecer as
      # fatias, a página abre com índice velho — e nada mais acusa isso.
      - name: Fatias de índice em dia
        run: node scripts/split-indexes.mjs --check

      # Integridade do catálogo VERSIONADO (id duplicado, carta sem id/nome/set).
      # Passou a valer pro Pokémon também, que é o maior catálogo do site e
      # justamente o que estava de fora — o lint lia o cards.js, que pro Pokémon
      # é uma amostra de 13 cartas. Aqui a trava de ESTABILIDADE de id não tem o
      # que comparar (nada mudou na árvore de trabalho); ela morde no deploy,
      # onde o lint roda depois dos syncs.
      - name: Catálogo íntegro (ids duplicados, carta quebrada)
        run: node scripts/lint-catalog.mjs

      - name: Sintaxe dos scripts de build
        run: for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done

      - name: Minificação compila (esbuild barra JS quebrado)
        run: |
          npx --yes esbuild --minify --charset=utf8 --outdir=/tmp/ci-min src/*.js
          npx --yes esbuild --minify --charset=utf8 --outfile=/tmp/ci-sw.js sw.js
          npx --yes esbuild --minify --outfile=/tmp/ci-min/styles.min.css styles.css

      # O shared.js e o núcleo do CSS viajam em TODA página deste site sem
      # bundler: se engordarem sem ninguém olhar, o "parece app" some aos
      # poucos e nenhum teste acusa. Mede o que o usuário recebe (minificado +
      # gzip) contra tetos versionados no próprio script.
      - name: Orçamento de peso do app shell
        run: node scripts/check-size.mjs /tmp/ci-min
