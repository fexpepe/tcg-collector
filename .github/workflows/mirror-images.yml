name: Espelho de imagens (R2)

# Copia pro bucket R2 (img.sleevu.app) as imagens de carta que o site exibe —
# ver scripts/mirror-r2.mjs. Diário, depois do deploy da manhã (06:20 UTC mais
# o atraso da fila do GitHub), pra pegar as cartas que entraram no catálogo
# hoje. Retomável: cada rodada trabalha até `minutes` e salva o índice; o que
# não coube sai na próxima. O deploy do site consulta o status publicado e só
# aponta pro espelho os hosts já COMPLETOS.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      host:
        description: "Só este host (vazio = todos, na ordem do rollout)"
        required: false
        default: ""
      limit:
        description: "Teto de objetos nesta rodada (vazio = sem teto)"
        required: false
        default: ""
      minutes:
        description: "Minutos de trabalho antes de parar e salvar"
        required: false
        default: "320"

# Uma rodada por vez: duas escrevendo o mesmo índice se atropelariam.
concurrency:
  group: mirror-images
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # O MESMO catálogo construído que o deploy publica, no pacote que o build
      # completo da main salva (passo "Empacota o catálogo pro espelho de
      # imagens" do deploy.yml). Sem ele não há o que espelhar — e não se
      # sincroniza nada aqui: fonte de verdade é uma só. Até 14/11/2026 o job
      # restaurava o cache do build rápido, que o actions/cache identifica pela
      # lista de caminhos: cada jogo novo mudava a lista, o cache salvo antes
      # dele deixava de ser achado e o job saía verde sem espelhar nada (de
      # 12/11 em diante, nenhuma carta nova chegou ao img.sleevu.app). O pacote
      # tem caminho fixo e não depende da lista de jogos.
      - name: Restaura o pacote do catálogo (salvo pelo deploy)
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/catalogo-espelho.tar
          key: catalogo-espelho-${{ github.run_id }}
          restore-keys: catalogo-espelho-

      - name: Abre o pacote do catálogo
        run: |
          if [ -s "$RUNNER_TEMP/catalogo-espelho.tar" ]; then
            tar -xf "$RUNNER_TEMP/catalogo-espelho.tar"
            echo "Catálogo: $(ls data/*/manifest.generated.js | wc -l) jogos com manifest."
          fi

      # O sharp (redimensionamento) mora FORA do repositório: o site não tem
      # package.json nem bundler, e não vai ganhar um por causa do job. Versão
      # fixa; binário pré-compilado, instala em segundos.
      - name: Instala o sharp fora do repositório
        run: |
          mkdir -p "$RUNNER_TEMP/sharp" && cd "$RUNNER_TEMP/sharp"
          npm init -y >/dev/null
          npm install --no-audit --no-fund sharp@0.33.5

      - name: Espelha as imagens
        env:
          SHARP_DIR: ${{ runner.temp }}/sharp/node_modules/sharp
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: sleevu-img
          # Purga da borda das imagens REGRAVADAS (arte que mudou na mesma
          # chave). Opcional: sem os dois secrets, o job só avisa quantas ficaram
          # velhas na borda. O token precisa de Zone > Cache Purge na zona sleevu.app.
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          IN_HOST: ${{ inputs.host }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_MINUTES: ${{ inputs.minutes }}
        run: |
          # Sem catálogo = job VERMELHO. Saía verde (exit 0) e o espelho ficou
          # parado dois dias sem ninguém ver (13–14/11/2026).
          if [ ! -s data/manifest.generated.js ]; then
            echo "::error::Sem o pacote do catálogo — rode o deploy da main em modo completo (schedule ou manual): é ele que salva o pacote."
            exit 1
          fi
          args=""
          [ -n "$IN_HOST" ] && args="$args --host $IN_HOST"
          [ -n "$IN_LIMIT" ] && args="$args --limit $IN_LIMIT"
          [ -n "$IN_MINUTES" ] && args="$args --minutes $IN_MINUTES"
          node scripts/mirror-r2.mjs $args
