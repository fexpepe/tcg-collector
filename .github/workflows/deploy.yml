name: Build e deploy (Cloudflare Pages)

on:
  push:
    # main -> produção; qualquer outra branch -> preview (URL própria).
    # Mudanças só de documentação não disparam build/deploy.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    # DIÁRIO, 06:20 UTC = 03:20 de Brasília. Todo dia o catálogo e os preços das
    # fontes GRÁTIS (TCGdex, TCGCSV, Scryfall, Lorcast e os vintage) são
    # atualizados — elas cobrem 11 dos 12 jogos e não custam nada, então não há
    # motivo pra esperar 2 dias. O snapshot de preço é 1 por dia (o
    # sync-price-history substitui o ponto quando roda de novo no mesmo dia).
    #
    # 06:20 e não 06:00: o cron do GitHub é BEST-EFFORT e a fila fica mais cheia
    # na hora cheia. Mesmo assim atrasa — as duas últimas execuções agendadas
    # saíram ~3h30 depois do horário. Não dá pra tratar como horário garantido.
    - cron: "20 6 * * *"
    #
    # Sexta 21:00 UTC: dia de lançamento de set do Pokémon TCG. Existe pra pegar
    # o set novo assim que a TCGdex publica, em vez de só na manhã seguinte.
    - cron: "0 21 * * 5"
    #
    # As APIs por CRÉDITO (PPT e MYP) NÃO rodam todo dia — ver o passo "Decide se
    # usa as APIs pagas". Preço JP/graded muda devagar, e limitar a 3x/semana
    # deixa a cota diária livre pra um build manual.
  # Disparo manual (aba Actions -> Run workflow): redispara sem inventar commit
  # quando o deploy falhou por credencial/infra e o código está certo.
  workflow_dispatch:

permissions:
  contents: write # o build commita o snapshot do catálogo Pokémon de volta (ver passo "Versiona")

# Opta as actions JS para o Node 24 (o runner vai forçar isso a partir de
# 16/09/2026); evita o aviso de deprecação do Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Uma execução por branch (um push novo na mesma branch cancela o anterior).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Actions pinadas por SHA (supply chain); o comentário marca a versão.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # ── CAMINHO RÁPIDO ────────────────────────────────────────────────────
      # A sincronização dos catálogos é ~10 min e fala com uma dúzia de APIs.
      # Rodar isso a cada push de CSS era esperar 10 minutos pra ver uma cor
      # mudar — e, num repo privado, estouraria sozinha a cota do Actions.
      #
      # Push = SÓ BUILD: reaproveita os artefatos do último build completo, que
      # é o mesmo byte que está em produção agora (não há como divergir).
      # Schedule/manual = build COMPLETO, com todos os syncs.
      #
      # O que NÃO é gated de propósito: lint, prerender, fatias de índice,
      # minificação e deploy rodam sempre. O prerender em especial — ele muda
      # junto com o código (título, H1, JSON-LD), então um push de SEO precisa
      # regerar as milhares de páginas mesmo sem catálogo novo. (Quantas são,
      # exatamente, o passo "Conta arquivos" lá no fim mede a cada build — o
      # número cresce a cada jogo/idioma e não cabe num comentário.)
      - name: Restaura catálogo construído (artefatos do último build)
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Espelha o .gitignore: só o que o build PRODUZ e o git não guarda.
          # As pastas sets/ do Magic e do Yu-Gi-Oh ficam DE FORA — essas são
          # versionadas, e restaurá-las por cima do checkout arriscaria voltar
          # o catálogo pra uma versão mais velha que a do repo.
          path: |
            data/*.generated.js
            data/*.generated.json
            data/search-index.json
            data/*/*.generated.js
            data/*/*.generated.json
            data/*/search-index.json
            data/lorcana/sets
            data/onepiece/sets
            data/fab/sets
            data/gundam/sets
            data/dbfw/sets
            data/digimon/sets
            data/riftbound/sets
            data/unionarena/sets
            data/naruto/sets
            data/hxh/sets
            data/jump/sets
            data/magic/cards.js
            data/magic/indexes.js
            data/magic/pricing.js
            data/magic/indexes-*.json
            data/ygo/cards.js
            data/ygo/indexes.js
            data/ygo/pricing.js
            data/ygo/indexes-*.json
          key: catalogo-build-${{ github.run_id }}
          restore-keys: catalogo-build-

      # A GUARDA. Sem ela, um cache expirado (o GitHub descarta o que fica 7
      # dias sem uso) publicaria um site sem catálogo nenhum — pior que esperar
      # 10 minutos. Se qualquer peça essencial faltar, o build volta a ser
      # completo, e o log diz por quê.
      - name: Decide o modo do build (rápido ou completo)
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Evento '${{ github.event_name }}': build COMPLETO."
            echo "RODA_SYNC=true" >> $GITHUB_ENV
            exit 0
          fi
          faltando=""
          for f in data/manifest.generated.js data/pricing.generated.js \
                   data/onepiece/pricing.generated.js data/lorcana/pricing.generated.js \
                   data/magic/pricing.generated.js data/ygo/pricing.generated.js; do
            [ -s "$f" ] || faltando="$faltando $f"
          done
          if [ -n "$faltando" ]; then
            echo "Cache incompleto ($faltando) — caindo pro build COMPLETO."
            echo "RODA_SYNC=true" >> $GITHUB_ENV
          else
            echo "Catálogo veio do cache: build RÁPIDO (sem sincronização)."
            echo "RODA_SYNC=false" >> $GITHUB_ENV
          fi

      # As APIs por CRÉDITO (PPT e MYP) rodam 3x/semana, não todo dia: segunda e
      # quarta pelo cron diário, sexta pelo da noite. O plano da PPT dá 20.000
      # créditos POR DIA e um run gasta no máximo 8.000 (--budget abaixo), então
      # o limite não é o problema — é que preço JP/graded muda devagar e não
      # compensa queimar cota diária pra reprocessar o mesmo número.
      # Pular é seguro: o merge-catalogs lê data/ppt-prices.generated.json num
      # try/catch ("no-op sem o arquivo") e esse artefato está no cache de build,
      # então o run grátis reaproveita o resultado da última rodada paga.
      - name: Decide se usa as APIs pagas
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Evento '${{ github.event_name }}': inclui as APIs por crédito."
            echo "RODA_PAGO=true" >> $GITHUB_ENV
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "0 21 * * 5" ]; then
            echo "Cron de sexta (lançamento): inclui as APIs por crédito."
            echo "RODA_PAGO=true" >> $GITHUB_ENV
            exit 0
          fi
          # %u: 1=segunda … 7=domingo. Lido na HORA DO RUN — com o atraso da fila
          # do GitHub o dia continua o mesmo (o cron é 06:20 UTC; atrasos vistos
          # foram de horas, não de um dia).
          dia=$(date -u +%u)
          if [ "$dia" = "1" ] || [ "$dia" = "3" ]; then
            echo "Cron diário em dia pago (dia $dia): inclui as APIs por crédito."
            echo "RODA_PAGO=true" >> $GITHUB_ENV
          else
            echo "Cron diário (dia $dia): só fontes GRÁTIS (PPT/MYP pulados)."
            echo "RODA_PAGO=false" >> $GITHUB_ENV
          fi

      # O cache incremental do sync (payloads brutos da TCGdex + preços por set
      # da PPT) faz os deploys levarem minutos em vez de refazer tudo. Restore e
      # save SÃO SEPARADOS de proposito: o save roda ANTES da limpeza que apaga
      # data/.cache (com o actions/cache combinado, o save automatico rodava no
      # POST, depois do rm, e salvava vazio — o cache nunca persistia).
      # Só no build completo: num build rápido nenhum sync lê este cache, e
      # ele é grande — restaurá-lo seria justamente o tempo que queremos cortar.
      - name: Restaura cache (TCGdex + PPT)
        if: env.RODA_SYNC == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: data/.cache
          key: tcgdex-cache-${{ github.run_id }}
          restore-keys: tcgdex-cache-

      # zh-cn (simplificado) é o CHINÊS PADRÃO do site; zh-tw (tradicional) é
      # fundido dentro do mesmo "Chinês" — por isso o zh-cn vem antes no merge.
      - name: Sincroniza catálogos (en, ja, zh-cn, zh-tw, pt)
        if: env.RODA_SYNC == 'true'
        run: |
          node scripts/sync-tcgdex.mjs en
          node scripts/sync-tcgdex.mjs ja
          node scripts/sync-tcgdex.mjs zh-cn
          node scripts/sync-tcgdex.mjs zh-tw
          node scripts/sync-tcgdex.mjs pt

      - name: Atualiza mapas de tipos e nomes de Pokémon
        if: env.RODA_SYNC == 'true'
        run: |
          node scripts/sync-pokemon-types.mjs
          node scripts/sync-pokemon-names.mjs

      # Preços de mercado BR (MYP). NO-OP enquanto o secret MYP_API_TOKEN nao
      # existir — o script sai com sucesso e o merge segue só com a referencia
      # internacional. Quando o token chegar, o BR passa a ter prioridade no valor.
      - name: Sincroniza preços BR (MYP)
        if: env.RODA_SYNC == 'true' && env.RODA_PAGO == 'true'
        env:
          MYP_API_TOKEN: ${{ secrets.MYP_API_TOKEN }}
        run: node scripts/sync-myp.mjs pokemon

      # Preços/imagens JP da PokemonPriceTracker, onde a TCGdex falha (preço-lixo
      # do Cardmarket e imagens faltando, ex.: era Mega). NO-OP sem o secret.
      # Incremental: cacheia por set em data/.cache/ppt (preservado entre runs) e
      # respeita um orçamento de créditos/run pra nunca estourar o limite do plano.
      - name: Sincroniza preços/imagens JP (PPT)
        if: env.RODA_SYNC == 'true' && env.RODA_PAGO == 'true'
        env:
          PPT_API_TOKEN: ${{ secrets.PPT_API_TOKEN }}
        run: node scripts/sync-ppt.mjs --budget 8000 --graded

      - name: Mescla catálogos num manifest unificado
        if: env.RODA_SYNC == 'true'
        run: node scripts/merge-catalogs.mjs en ja zh-cn zh-tw pt

      # Espelha logos/símbolos de SET do Pokémon localmente (independência da
      # TCGdex; as CARTAS seguem remotas). Roda DEPOIS do merge (que reescreve os
      # chunks) e reescreve setLogo/setSymbol pros caminhos em data/set-logos/.
      # Idempotente: baixa só o que falta (versionado) e re-localiza as URLs que
      # o sync trouxe de volta remotas. Não derruba o build se o CDN estiver fora.
      - name: Espelha logos de set (Pokémon)
        if: env.RODA_SYNC == 'true'
        run: node scripts/mirror-set-logos.mjs || echo "mirror-set-logos falhou; segue com as URLs da TCGdex"

      # Sets JAPONESES: a TCGdex não tem logo em ja (o payload vem sem o campo e
      # o CDN dá 404), então os arquivos vêm do Bulbagarden e estão VERSIONADOS
      # em data/set-logos/ja/. Aqui só o carimbo (--no-fetch, zero rede): o sync
      # acabou de reescrever os chunks com setLogo:"" e é isto que devolve o
      # caminho local. Baixar logo novo é passo LOCAL (rode sem --no-fetch).
      - name: Carimba logos de set japoneses
        if: env.RODA_SYNC == 'true'
        run: node scripts/mirror-ja-set-logos.mjs --no-fetch || echo "mirror-ja-set-logos falhou; sets JP seguem com o nome no lugar do logo"

      # Histórico de preços SEM servidor: busca o acumulador publicado no deploy
      # anterior (a produção é o "banco"), anexa o snapshot de hoje e re-publica
      # (+ deltas ▲▼ e maiores altas/quedas). Backup em data/.cache.
      - name: Snapshot de preços (histórico Pokémon)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data

      # Catálogo do Lorcana (Lorcast). Independente do Pokémon; gera data/lorcana/
      # cards/indexes/pricing + .generated (modo prod). Não derruba o build se a
      # API comunitária estiver fora (mantém o cards.js versionado).
      - name: Sincroniza catálogo do Lorcana (Lorcast)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-lorcana.mjs || echo "sync-lorcana falhou; mantém o catalogo versionado"

      - name: Snapshot de preços (histórico Lorcana)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/lorcana

      # Catálogo do One Piece (TCGCSV, espelho público do TCGplayer — cat. 68).
      # Gera data/onepiece/ cards/indexes/pricing + .generated com preços USD.
      # Não derruba o build se o espelho estiver fora (mantém o catálogo versionado).
      - name: Sincroniza catálogo do One Piece (TCGCSV)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-onepiece.mjs || echo "sync-onepiece falhou; mantém o catalogo versionado"

      # One Piece VINTAGE: Carddass Hyper Battle (1999–2002). Sem API/preço aberto;
      # a checklist vem do Grand Line Wiki (cache em data/.cache). ANEXA as cartas
      # vintage ao catálogo do One Piece (roda DEPOIS do sync-onepiece). Sem preço.
      - name: Anexa catálogo vintage do One Piece (Carddass)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-onepiece-vintage.mjs || echo "sync-onepiece-vintage falhou; segue sem o vintage"

      # Espelha as imagens vintage localmente (1x; reuso via data/.cache entre
      # builds). Se espelhar algo novo, refaz o build vintage pra apontar pro local.
      - name: Espelha imagens vintage (Carddass)
        if: env.RODA_SYNC == 'true'
        run: (node scripts/mirror-vintage-images.mjs && node scripts/sync-onepiece-vintage.mjs --no-fetch) || echo "mirror falhou; segue com wsrv"

      # One Piece VINTAGE #2: o One Piece Card Game de 2002–2005 (verso madeira),
      # ~1330 cartas em 22 sets, da mesma checklist do Grand Line Wiki. Anexa ao
      # catálogo (dedupe pelo prefixo op2002-, coexiste com o Carddass). Sem preço.
      - name: Anexa catálogo One Piece Card Game 2002 (vintage)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-onepiece-2002.mjs || echo "sync-onepiece-2002 falhou; segue sem o 2002"

      - name: Snapshot de preços (histórico One Piece)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/onepiece

      # Catálogo do Magic (Scryfall): catálogo + preços TCGplayer USD/Cardmarket
      # EUR + imagens numa fonte só, grátis. Cache incremental por set em
      # data/.cache/magic (invalida quando o card_count muda, quando o set é
      # recente (<120d, preço diário) ou na rotação semanal de preço — ~1/7 dos
      # sets antigos por dia, pro preço nunca passar de 7 dias defasado). Padrão
      # POKÉMON de durabilidade: os chunks data/magic/sets/ são versionados pelo
      # snapshot; o script congela neles se o Scryfall estiver fora.
      - name: Sincroniza catálogo do Magic (Scryfall)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-magic.mjs || echo "sync-magic falhou; mantém os chunks versionados"

      - name: Snapshot de preços (histórico Magic)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/magic

      # Símbolos de set do Magic (Scryfall SVG, svgs.scryfall.io sem rate limit):
      # baixa o ícone local (data/magic/set-logos/) e REESCREVE os chunks pro
      # setLogo local. DEPOIS do sync-magic de propósito: o sync usa setLogo
      # cacheado (Scryfall) mesmo com o SVG já presente, então o rewrite tem que
      # ser a palavra final, senão os símbolos ficam remotos (dependentes de CDN
      # instável) apesar do espelho existir. Idempotente; não derruba o build.
      - name: Espelha símbolos de set (Magic) e reaponta os chunks
        if: env.RODA_SYNC == 'true'
        run: node scripts/mirror-magic-set-logos.mjs || echo "mirror-magic-set-logos falhou; segue com o ícone remoto"

      # Logos de set do FAB (the-fab-cube -> PNG oficial da LSS, redimensionado
      # via wsrv.nl). ANTES do sync pra ele já apontar setLogo pro webp local.
      # ~41 sets principais; o resto cai na arte da carta. Idempotente.
      - name: Espelha logos de set (FAB)
        if: env.RODA_SYNC == 'true'
        run: node scripts/mirror-fab-set-logos.mjs || echo "mirror-fab-set-logos falhou; segue com a arte da carta"

      # Catálogo do Flesh and Blood (TCGCSV cat. 62, mesmo espelho do One
      # Piece). Padrão One Piece: cards.js versionado é a durabilidade.
      - name: Sincroniza catálogo do FAB (TCGCSV)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-fab.mjs || echo "sync-fab falhou; mantém o catalogo versionado"

      - name: Snapshot de preços (histórico FAB)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/fab

      # Gundam Card Game (TCGCSV cat. 86, Bandai). Padrão One Piece/FAB:
      # cards.js versionado é a durabilidade; chunks regenerados no build.
      - name: Sincroniza catálogo do Gundam (TCGCSV)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-gundam.mjs || echo "sync-gundam falhou; mantém o catalogo versionado"

      - name: Snapshot de preços (histórico Gundam)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/gundam

      # Dragon Ball Super FUSION WORLD (TCGCSV cat. 80, Bandai). Fusion World
      # (2024+), distinto do classico "Masters" (cat 27) e do DBZ TCG (cat 23).
      - name: Sincroniza catálogo do Dragon Ball Fusion World (TCGCSV)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-dbfw.mjs || echo "sync-dbfw falhou; mantém o catalogo versionado"

      - name: Snapshot de preços (histórico Dragon Ball Fusion)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/dbfw

      # Yu-Gi-Oh! (TCGCSV cat. 2, Konami): o MAIOR catalogo (~46k impressoes).
      # Padrao MAGIC: chunks versionados, monolito cards.js fora do deploy (ver
      # gitignore e o passo "Remove arquivos"). Nao derruba o build se cair.
      - name: Sincroniza catálogo do Yu-Gi-Oh! (TCGCSV)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-ygo.mjs || echo "sync-ygo falhou; mantém os chunks versionados"

      - name: Snapshot de preços (histórico Yu-Gi-Oh)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/ygo

      # Digimon Card Game (TCGCSV cat. 63, Bandai 2020+). Padrao One Piece/FAB.
      - name: Sincroniza catálogo do Digimon (TCGCSV)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-digimon.mjs || echo "sync-digimon falhou; mantém o catalogo versionado"

      - name: Snapshot de preços (histórico Digimon)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/digimon

      # Riftbound (TCGCSV cat. 89, Riot — League of Legends, 2025). Padrao FAB.
      - name: Sincroniza catálogo do Riftbound (TCGCSV)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-riftbound.mjs || echo "sync-riftbound falhou; mantém o catalogo versionado"

      - name: Snapshot de preços (histórico Riftbound)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/riftbound

      # Union Arena (TCGCSV cat. 81, Bandai 2024 — um anime por set). Padrao FAB.
      - name: Sincroniza catálogo do Union Arena (TCGCSV)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-unionarena.mjs || echo "sync-unionarena falhou; mantém o catalogo versionado"

      - name: Snapshot de preços (histórico Union Arena)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-price-history.mjs data/unionarena

      # Naruto (TCGCSV): só sincroniza quando a categoria existir (secret/var
      # NARUTO_TCGCSV_CATEGORY). Sem categoria, o script sai sem mexer em nada.
      - name: Sincroniza catálogo do Naruto (TCGCSV, se configurado)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-naruto.mjs || echo "sync-naruto falhou; mantém o catalogo versionado"
        env:
          NARUTO_TCGCSV_CATEGORY: ${{ vars.NARUTO_TCGCSV_CATEGORY }}

      # Naruto VINTAGE: NARUTO カードゲーム (Bandai 2003–2006), checklist do
      # tcg-db.nikita.jp (snapshot versionado, não regride). ANEXA ao catálogo do
      # Naruto (roda DEPOIS do sync-naruto). Imagens via wsrv.nl. Sem preço.
      - name: Anexa catálogo vintage do Naruto (Bandai 2003)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-naruto-vintage.mjs || echo "sync-naruto-vintage falhou; segue com o snapshot versionado"

      # Miracle Battle Carddass (2009-2015): linhas ONE PIECE, NARUTO e
      # HUNTER x HUNTER do jogo crossover da Jump, anexadas como vintage nos
      # catalogos de cada jogo (roda DEPOIS dos syncs deles). O catalogo do
      # HUNTER x HUNTER nasce AQUI (data/hxh/). Fonte tcg-db, sem preco.
      - name: Anexa Miracle Battle Carddass (One Piece + Naruto + Hunter x Hunter)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-miracle-battle.mjs || echo "sync-miracle-battle falhou; segue com o snapshot versionado"

      # Carddass Hyper Battle HUNTER x HUNTER (1999-2001): linha PRINCIPAL do
      # jogo hxh. Fonte: Hunterpedia (API MediaWiki) - unica com scan carta a
      # carta. Roda DEPOIS do miracle-battle (que cria data/hxh/). Sem preco.
      - name: Anexa Carddass Hyper Battle (Hunter x Hunter)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-hxh-hyper-battle.mjs || echo "sync-hxh-hyper-battle falhou; segue com o snapshot versionado"

      # Data Carddass NARUTO (arcade, 2005-2008): checklist do noihjp (fa site),
      # sem imagens. Anexa ao catalogo do Naruto (roda DEPOIS dos outros).
      - name: Anexa Data Carddass NARUTO (arcade)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-naruto-datacarddass.mjs || echo "sync-naruto-datacarddass falhou; segue com o snapshot versionado"

      # Data Carddass NARUTO — Formation (2007-08) e Cross (2009-10): snapshot
      # versionado do catalogo do Suruga-ya (re-coleta manual; anti-bot barra
      # fetch em CI). Anexa as duas linhas ao catalogo do Naruto.
      - name: Anexa Data Carddass Formation + Cross
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-naruto-dc-cross-formation.mjs || echo "sync formation/cross falhou; segue com o snapshot versionado"

      # Naruto CCG americano (Bandai USA 2006–2013): checklist + scans do
      # narutocards.ca, snapshot versionado. Anexa a linha nrt-ccg-.
      - name: Anexa Naruto CCG (Bandai USA)
        if: env.RODA_SYNC == 'true'
        run: node scripts/sync-naruto-ccg.mjs || echo "sync-naruto-ccg falhou; segue com o snapshot versionado"

      # Nomes das cartas de Naruto: japonês -> inglês. DEPOIS dos syncs
      # que alimentam esse catálogo (o mapa fica num lugar só em vez de repetido
      # nos quatro). Idempotente e sem rede — ver o cabeçalho do script.
      - name: Traduz nomes das cartas de Naruto
        if: env.RODA_SYNC == 'true'
        run: node scripts/translate-naruto-names.mjs || echo "translate-naruto-names falhou; catalogo segue com os nomes originais"

      # JUMP: compila os sets curados versionados (data/jump/curated/*.json).
      - name: Compila catálogo JUMP (curadoria)
        if: env.RODA_SYNC == 'true'
        run: node scripts/build-jump.mjs || echo "build-jump falhou; mantém o catalogo versionado"

      # Lint dos catálogos: FALHA o deploy em corrupção dura (ids duplicados,
      # catálogo zerado) — contrapeso dos "|| echo" de resiliência acima.
      #
      # E, desde a trava de ESTABILIDADE DE ID, falha também quando o catálogo
      # recém-sincronizado PERDE um id que já estava publicado ou aponta um id
      # existente pra outra carta. Roda aqui de propósito: é o último ponto
      # ANTES do commit do snapshot, então o HEAD ainda é o catálogo que está no
      # ar — a comparação é exatamente "o que vou publicar" × "o que a conta das
      # pessoas conhece". Coleção, wishlist, decks e binders são indexados por
      # cardId; id que some tira a carta da conta de quem tem, e id repontado
      # troca a carta por outra (foi assim que carta de outro idioma apareceu).
      - name: Lint dos catálogos (integridade + estabilidade de id)
        run: node scripts/lint-catalog.mjs

      # Durabilidade: versiona o catálogo VALIDADO de volta no repo (chunks do
      # Pokémon + cards/indexes/pricing dos outros jogos; o .gitignore filtra
      # caches e .generated). Junto com a união preservadora do sync-tcgdex
      # ("carta que some da API é mantida"), garante que carta indexada nunca
      # desaparece — API morreu = catálogo congela, nenhum item de portfólio
      # some. Só na main; o marcador skip-ci na mensagem evita loop de deploy.
      # Push direto, sem rebase (o workspace do build fica sujo de propósito):
      # numa race com push manual, pula — o próximo build versiona.
      # (build rápido não sincronizou nada, então não há snapshot a versionar)
      - name: Versiona snapshot do catálogo
        if: env.RODA_SYNC == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Catálogo sem mudanças — nada a versionar."
          else
            git commit -m "Catálogo: snapshot automático do build [skip ci]"
            git push origin HEAD:main && echo "Snapshot versionado." \
              || echo "Push rejeitado (race com outro push); o próximo build versiona."
          fi

      # SEO: pré-renderiza uma página HTML estática por set — Pokémon, Lorcana e
      # One Piece — em /set/<slug>.html (title, meta, Open Graph, JSON-LD e a lista
      # de cartas já no HTML) + regenera o sitemap.xml com todas as URLs. Assim o
      # Google indexa "Base Set", "Romance Dawn" etc. em vez da casca vazia da SPA.
      # Lê os chunks data/sets/** (Pokémon) e data/{lorcana,onepiece}/cards.js.
      - name: Pré-renderiza páginas de set (SEO)
        run: node scripts/prerender-catalog.mjs

      # Salva o cache AGORA (data/.cache ainda existe; a limpeza apaga depois).
      - name: Salva cache (TCGdex + PPT)
        if: env.RODA_SYNC == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: data/.cache
          key: tcgdex-cache-${{ github.run_id }}

      # Guarda os artefatos do build COMPLETO pros próximos pushes reaproveitarem
      # (é o que faz o build rápido existir). Só depois do lint: cache de
      # catálogo corrompido se propagaria por todos os deploys seguintes.
      # ANTES do passo "Remove arquivos", que apaga data/magic/cards.js e cia.
      - name: Salva catálogo construído (pro build rápido)
        if: env.RODA_SYNC == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            data/*.generated.js
            data/*.generated.json
            data/search-index.json
            data/*/*.generated.js
            data/*/*.generated.json
            data/*/search-index.json
            data/lorcana/sets
            data/onepiece/sets
            data/fab/sets
            data/gundam/sets
            data/dbfw/sets
            data/digimon/sets
            data/riftbound/sets
            data/unionarena/sets
            data/naruto/sets
            data/hxh/sets
            data/jump/sets
            data/magic/cards.js
            data/magic/indexes.js
            data/magic/pricing.js
            data/magic/indexes-*.json
            data/ygo/cards.js
            data/ygo/indexes.js
            data/ygo/pricing.js
            data/ygo/indexes-*.json
          key: catalogo-build-${{ github.run_id }}

      # Rede de segurança das FATIAS de índice (indexes-sets.js etc.), que é o
      # que as páginas carregam de verdade. Os syncs já as geram, mas cada sync
      # tem "|| echo ... mantém o catalogo versionado": se o do jogo X falhar,
      # sobra o indexes.js versionado sem as fatias. Este passo as deriva do que
      # existir no disco, então nenhum jogo sai do build com fatia faltando.
      - name: Deriva fatias de índice que faltarem
        run: node scripts/split-indexes.mjs

      # Metadados de set (logo, símbolo, data, série, total) e soma de preço em
      # cada entrada do manifest — é o que a lista de Sets desenha sem baixar
      # carta. Roda SEMPRE, inclusive no build rápido: ali os syncs são pulados e
      # o manifest vem do cache do build anterior, então sem este passo ele fica
      # no formato velho e a tela de Sets perde logo, data e valor. Roda também
      # DEPOIS dos espelhos de logo, pra o manifest apontar pro arquivo local.
      - name: Completa o manifest com metadados de set
        run: node scripts/enrich-manifest.mjs

      # Calendario de lancamentos: le a data `release` que o passo acima acabou
      # de garantir em toda entrada de manifest e publica data/releases.generated
      # .json (a pagina /lancamentos) + lancamentos.ics (assinatura no Google/
      # Apple/Outlook). Uma fonte, dois formatos — se a pagina lesse os 13
      # manifests no navegador e o .ics saisse de outro lugar, os dois
      # divergiriam no primeiro build em que um jogo falhasse. DEPOIS do
      # enrich-manifest de proposito: e ele que poe a data no build rapido.
      - name: Calendário de lançamentos (.ics + JSON da página)
        run: node scripts/build-releases.mjs

      # Mercado do jogo: recorte PUBLICO e ja hidratado das altas/quedas do dia
      # e do indice de 30 dias, um arquivo por jogo. Os dois insumos ja eram
      # publicados (price-movers e market-index, do sync-price-history) e so o
      # Portfolio, atras de login, os lia. O join com nome/imagem sai AQUI pra a
      # pagina publica fazer uma requisicao so — o Portfolio faz baixando o
      # chunk inteiro do set de cada carta, o que nao serve pra quem vem do
      # Google. Roda em todo deploy: no build rapido os insumos vem do cache.
      - name: Mercado do jogo (trilho de altas e quedas)
        run: node scripts/build-market.mjs

      # Reparte o monólito de preços de cada jogo em chunks POR SET (espelhando
      # os chunks de carta) e liga a flag `pc` no manifest. Roda em TODO deploy
      # pela mesma razão do enrich-manifest: no build rápido os syncs são
      # pulados e um passo dentro do sync deixaria a produção sem os chunks.
      - name: Reparte os preços por set
        run: node scripts/split-pricing.mjs

      # Tendencia por set ("▲ 3,2% na semana"): agrega a serie diaria POR CARTA
      # do price-history com o set de cada carta (dos chunks) e escreve dv7/dv30
      # direto no manifest — que a tela de Sets ja baixa, entao nao ha requisicao
      # nova. Media equal-weighted das variacoes RELATIVAS, a mesma do indice de
      # mercado: somar precos faria uma carta de US$ 900 mandar no set inteiro.
      # POR ULTIMO entre os passos que tocam o manifest (enrich-manifest e
      # split-pricing reescrevem ele): assim nada apaga os campos novos.
      - name: Tendência por set (chip de variação)
        run: node scripts/build-set-trends.mjs

      # API na borda (Fase 2): gera o banco de busca a partir do MESMO catálogo
      # e, SE o token tiver permissão de D1, cria/carrega o banco e liga o
      # binding no projeto Pages. Sem a permissão, o passo explica o que falta
      # e sai com sucesso — o site continua saindo igual e a /api/search
      # responde "desligada" (o cliente usa o caminho estático de sempre).
      - name: Prepara a API na borda (D1)
        run: |
          node scripts/build-d1.mjs
          node scripts/deploy-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # O game.js injeta o catálogo em runtime por jogo; em produção ele carrega
      # os arquivos .generated mesclados em vez dos crus. Basta flipar a flag.
      # PRECISA rodar antes da minificação (o padrão com espaços some no minify).
      - name: Ativa modo manifest (flag no game.js)
        run: sed -i 's|var MANIFEST = false|var MANIFEST = true|' src/game.js

      # Mesma razão do passo acima (o esbuild dobra `false` em `!1`, e o padrão
      # com espaços some). Diz ao install do service worker que os arquivos do
      # shell vão ter hash no nome, então ele para de furar o cache do navegador
      # com cache:"reload" — e um deploy passa a baixar só o que mudou, em vez dos
      # ~345 KB do shell inteiro. O hash-assets.mjs confere que isto rodou.
      - name: Avisa o service worker que o shell terá hash
        run: sed -i 's|const HASHED_ASSETS = false|const HASHED_ASSETS = true|' sw.js

      # Reparte cada src/i18n*.js em um arquivo POR IDIOMA e liga as páginas pra
      # carregar só o idioma ativo (via data-i18n no <html> + loader do theme.js).
      # O core viaja em toda página: ~46 KB comprimidos com os três idiomas
      # dentro, ~16 KB com um. ANTES da minificação e do hash (os nomes novos
      # entram como literais no theme.js e são reescritos pelo hash-assets).
      - name: Reparte as traduções por idioma
        run: node scripts/split-i18n.mjs --write

      # Reparte o styles.css: núcleo (o que toda página usa) + folhas por área
      # (landing, login, decks, portfólio, conta, wishlist, vendas, ajuda), ligadas
      # só nas páginas delas. ANTES da minificação — o script remove os comentários
      # pra parsear em segurança, e é a minificação que os descartaria de qualquer
      # forma. O repositório segue com um styles.css só.
      - name: Reparte o CSS por área
        run: node scripts/split-css.mjs --write

      # Funde theme.js + game.js num src/boot.js só. Os dois são síncronos no
      # <head>, antes do CSS: na primeira visita (sem cache, sem SW) eram duas
      # paradas em série no caminho do primeiro paint; agora é uma. DEPOIS do
      # split-i18n (que injeta o mapa de idiomas dentro do theme.js) e ANTES da
      # minificação e do hash. O --check equivalente roda no CI.
      - name: Funde os scripts de boot (theme + game)
        run: node scripts/bundle-boot.mjs

      # Minifica JS/CSS servidos, IN PLACE (as URLs não mudam; o repo fica intacto —
      # isso só existe no workspace do runner). Corta ~50% do transfer e acelera o
      # parse no mobile. Bônus: o esbuild FALHA em erro de sintaxe, então este passo
      # também barra deploy de código quebrado. Sourcemaps pra debugar produção.
      # --charset=utf8 mantém os acentos/emoji do i18n como UTF-8 (todas as páginas
      # declaram <meta charset="utf-8">; SWs são decodificados como UTF-8 por spec).
      - name: Minifica JS e CSS
        run: |
          npx --yes esbuild --minify --sourcemap --charset=utf8 --allow-overwrite --outdir=src src/*.js
          npx --yes esbuild --minify --charset=utf8 --allow-overwrite --outfile=styles.css styles.css
          npx --yes esbuild --minify --sourcemap --charset=utf8 --allow-overwrite --outfile=sw.js sw.js

      # Hash do conteúdo no nome do app shell (src/*.js, styles.css) e troca do
      # Cache-Control pra um ano `immutable`. DEPOIS da minificação (o hash tem
      # de ser dos bytes finais) e ANTES do "Remove arquivos", que apaga
      # scripts/. Falha o build se sobrar referência ao nome sem hash.
      - name: Versiona o app shell pelo hash (cache imutável)
        run: node scripts/hash-assets.mjs

      # data/magic/cards.js: o monolito do Magic (~37 MiB no build completo)
      # estoura o teto de 25 MiB/arquivo do Cloudflare Pages. Em produção NADA o
      # usa — o modo manifest carrega manifest.generated.js + chunks por set; o
      # cards.js só serve ao dev local (MANIFEST=false). Removido daqui como o
      # data/cards.generated.js. (One Piece/FAB têm cards.js menor, mas vão bater
      # no mesmo teto quando crescerem — candidatos ao mesmo tratamento.)
      #
      # assets/brand/: matéria-prima dos logos (os PNG/JPG originais de onde
      # saíram os game_*.webp de assets/games). Nenhuma página referencia esses
      # 6 arquivos — só o sleevu-wordmark.svg é usado (styles.css e SHELL_ASSETS
      # do sw.js), e ele FICA. Continuam versionados no repo; só não sobem.
      - name: Remove arquivos que não vão para o site
        run: |
          rm -rf .git .github .claude data/.cache data/cards.generated.js data/magic/cards.js data/ygo/cards.js scripts out README.md ROADMAP.md docs supabase tests .gitattributes
          rm -f assets/brand/Flesh_and_Blood_TCG_Logo.png assets/brand/Magic-The-Gathering-logo.png assets/brand/digimon.webp assets/brand/logo_title_dbfwcardgame.webp assets/brand/riftbound.webp assets/brand/yugioh.jpg
          rm -f assets/games/README.md assets/shops/README.md

      # O Cloudflare Pages recusa um deploy com mais de 20.000 arquivos. O site
      # cresce sozinho (cada set novo = 2 páginas de prerender + chunk + chunk de
      # preço; cada idioma multiplica), e sem esta conta o estouro apareceria
      # como deploy quebrado às 06:20, sem aviso nenhum. Aqui ele vira um AVISO
      # com semanas de antecedência — e o número real fica no log de todo build,
      # que é o dado que faltava pra decidir quanta imagem cabe aqui (o resto
      # vai pro R2). Rodar DEPOIS do rm acima: conta o que de fato sobe.
      - name: Conta arquivos (teto de 20.000 do Pages)
        run: |
          total=$(find . -type f | wc -l)
          echo "Arquivos no deploy: $total (teto do Pages: 20000)"
          if [ "$total" -gt 18000 ]; then
            echo "::error::$total arquivos — perto demais do teto de 20.000 do Cloudflare Pages. Reduza antes de crescer mais (candidatos: MAX_CARD_PAGES do prerender, chunks de preço, imagens espelhadas → R2)."
            exit 1
          fi
          if [ "$total" -gt 16000 ]; then
            echo "::warning::$total arquivos — 80% do teto de 20.000 do Pages. Hora de planejar o corte."
          fi

      # Deploy no Cloudflare Pages. main = produção; outras branches = preview
      # (URL única <hash>.tcg-collector.pages.dev). Pulado se o secret faltar.
      - name: Deploy para Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        run: |
          npx --yes wrangler@3 pages project create tcg-collector --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy . --project-name=tcg-collector --branch="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
