<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="title.decks">Decks da comunidade - Sleevu</title>
    <meta name="description" content="Decks de Pokémon, Magic, Lorcana, One Piece, Yu-Gi-Oh e mais, criados pela comunidade. Veja a lista de cartas, o custo total e quanto falta pra você montar o seu.">
    <link rel="canonical" href="https://sleevu.app/decks">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/decks">
    <meta property="og:title" content="Decks da comunidade — Sleevu">
    <meta property="og:description" content="Decks criados pela comunidade, com custo total e quanto falta pra você montar o seu.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#101218">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="index.html">Sleevu</a>
        <nav class="page-nav" aria-label="Páginas" data-active-page="decks"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>
      <div class="page-head">
        <h1 data-i18n="decks.publicHeading">Decks da comunidade</h1>
        <p class="page-sub" data-i18n="decks.publicLead">Veja o que a comunidade está montando — lista de cartas, custo total e quanto falta pra você montar o seu.</p>
      </div>

      <!-- Galeria pública (decks.js): aberta a QUALQUER visitante. Lista os
           decks publicados (tabela shares, kind=deck) com filtro por jogo; com
           ?s=<id> vira o viewer de um deck. Publicar/copiar exigem conta. -->
      <div id="deckCommunity">
        <noscript><p data-i18n="decks.publicLead">Veja o que a comunidade está montando — lista de cartas, custo total e quanto falta pra você montar o seu.</p></noscript>
      </div>
    </main>

    <script defer src="src/i18n.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/deck-rules.js"></script>
    <script defer src="src/decks.js"></script>
  </body>
</html>
