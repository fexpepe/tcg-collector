<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title.dashboard">Hub - Sleevu</title>
    <meta name="description" content="Seu hub de colecionador no Sleevu: resumo das coleções de todos os jogos, patrimônio e atalhos rápidos.">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://sleevu.app/dashboard">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js"></script>
    <!-- Página neutra (sessão hub): o de-para de setIds é estático e o fallback
         de imagem EN das "mais valiosas" precisa dele. -->
    <script src="data/set-id-map.js"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" aria-label="Páginas" data-active-page="dashboard"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main class="dash-main">
      <div class="page-head dash-head">
        <h1 data-i18n="nav.dashboard">Hub</h1>
        <div id="dashProfileLine" class="dash-profile-line" hidden></div>
      </div>

      <!-- Resumo instantâneo (localStorage + cookie do Portfólio; sem catálogo)
           Cada cartão LEVA à tela que explica o número (o link cobre o cartão
           inteiro, ver .stat-link). Antes eram números mortos: a pessoa via
           "12 slabs" no Hub e tinha que achar a página Graded pelo menu.
           O rótulo acessível é o próprio <p> do cartão (aria-labelledby), então
           ele já vem traduzido junto com o resto da tela. -->
      <section class="stats-grid" aria-label="Resumo do colecionador">
        <article class="stat-grand">
          <span id="dhValue">—</span>
          <span class="collector-badge" data-i18n="collector.badge">Modo Colecionador</span>
          <!-- Transparência do número grande: quantas cópias têm preço de fato.
               Só aparece quando falta alguma (ver dashboard.js). -->
          <span id="dhPriced" class="dash-priced" hidden></span>
          <p id="dhValueLabel" data-i18n="portfolio.networth">patrimônio (cartas + graded)</p>
          <a class="stat-link" href="portfolio" aria-labelledby="dhValueLabel"></a>
        </article>
        <article>
          <span id="dhCopies">0</span>
          <p id="dhCopiesLabel" data-i18n="stats.copies">cópias no total</p>
          <a class="stat-link" href="collection" aria-labelledby="dhCopiesLabel"></a>
        </article>
        <article>
          <span id="dhDistinct">0</span>
          <p id="dhDistinctLabel" data-i18n="stats.distinct">cartas distintas</p>
          <a class="stat-link" href="collection" aria-labelledby="dhDistinctLabel"></a>
        </article>
        <article>
          <span id="dhWish">0</span>
          <p id="dhWishLabel" data-i18n="dash.wish">na lista de desejos</p>
          <a class="stat-link" href="wishlist" aria-labelledby="dhWishLabel"></a>
        </article>
        <article>
          <span id="dhSlabs">0</span>
          <p id="dhSlabsLabel" data-i18n="dash.slabs">slabs graded</p>
          <a class="stat-link" href="graded" aria-labelledby="dhSlabsLabel"></a>
        </article>
      </section>

      <!-- Distribuição por marca (contagem de cartas distintas). O rótulo tem o
           MESMO estilo do "Ir para": as três zonas da página (resumo, jogos,
           atalhos) ficam com o mesmo ritmo de título (proposta de 2026-08-25). -->
      <!-- Continuar de onde parou: últimos sets visitados (tcg-recent-sets-v1,
           gravado pela página de set com o progresso da visita). Nasce
           escondido; sem histórico a seção não existe. -->
      <h2 class="dash-section-head" id="dhRecentHead" data-i18n="dash.continue" hidden>Continuar de onde parou</h2>
      <section id="dhRecent" class="dash-recent" aria-label="Continuar de onde parou" hidden></section>

      <h2 class="dash-section-head" data-i18n="dash.byGame">Por jogo</h2>
      <section id="dhGames" class="dash-games" aria-label="Coleções por jogo"></section>

      <!-- Atalhos: o HUB do jogador -->
      <h2 class="dash-section-head" data-i18n="dash.shortcuts">Ir para</h2>
      <section id="dhLinks" class="dash-links" aria-label="Atalhos"></section>

      <!-- Cápsulas detalhadas (hidratam carregando só as suas cartas) -->
      <section id="dhCaps" class="collection-dashboard" aria-label="Resumo detalhado" hidden>
        <article class="dash-card dash-top">
          <h3 data-i18n="dash.topTitle">Mais valiosas</h3>
          <ol id="dhTopList" class="dash-top-list"></ol>
        </article>
        <!-- "Distribuição por jogo" saiu (proposta de 2026-08-25): repetia
             exatamente a contagem da fileira de chips coloridos, na mesma tela.
             Os chips ficam (assinatura visual, espelham a Coleção); estes dois
             cards ganham a largura. -->
        <article class="dash-card dash-dist">
          <h3 data-i18n="dash.regionTitle">Distribuição por região</h3>
          <div id="dhRegion" class="dash-dist-bars"></div>
        </article>
      </section>
    </main>

    <script defer src="src/i18n.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/dashboard.js"></script>
  </body>
</html>
