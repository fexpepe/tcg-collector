<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title.sets">Sets - Sleevu</title>
    <meta name="description" content="Todos os sets de Pokémon TCG — internacionais, japoneses e chineses — com progresso de coleção e datas de lançamento.">
    <link rel="canonical" href="https://sleevu.app/sets">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/sets">
    <meta property="og:title" content="Sets - Sleevu">
    <meta property="og:description" content="Todos os sets de Pokémon TCG — internacionais, japoneses e chineses — com progresso de coleção e datas de lançamento.">
    <meta property="og:image" content="https://sleevu.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sets - Sleevu">
    <meta name="twitter:description" content="Todos os sets de Pokémon TCG — internacionais, japoneses e chineses — com progresso de coleção e datas de lançamento.">
    <meta name="twitter:image" content="https://sleevu.app/og-image.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js" data-catalog="cards"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" aria-label="Páginas" data-active-page="sets"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>

      <div class="page-head page-head-bar">
        <div class="page-head-bar-text">
          <h1 data-i18n="nav.sets">Sets</h1>
        </div>
        <label class="page-search-label" for="searchInput" data-i18n="search.title">Procurar:</label>
        <section class="page-search">
        <svg class="page-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
        <input id="searchInput" type="search" data-i18n-placeholder="search.placeholder.sets" placeholder="Nome do set, série ou sigla...">
        </section>
      </div>
      <!-- Preenchido por buildExploreSubnav (shared.js). Vem VAZIO e com a
           altura reservada no CSS pra pagina nao pular quando os chips
           entram — ver .explore-subnav[data-placeholder] no styles.css. -->
      <nav class="explore-subnav chip-filter" data-placeholder aria-label="Explorar"></nav>

      <div id="setRegionChips" class="chip-filter master-filter" role="group" aria-label="Origem dos sets">
        <button type="button" class="chip" data-lang-region="english" aria-pressed="true" data-i18n="setRegion.english">Inglês</button>
        <button type="button" class="chip" data-lang-region="portuguese" aria-pressed="false" data-i18n="setRegion.portuguese">Português</button>
        <button type="button" class="chip" data-lang-region="japanese" aria-pressed="false" data-i18n="setRegion.japanese">Japonês</button>
        <button type="button" class="chip" data-lang-region="chinese" aria-pressed="false" data-i18n="setRegion.chinese">Chinês</button>
      </div>


      <section class="toolbar" aria-label="Filtros">
      </section>

      <section class="results-header">
        <h2 data-i18n="results.heading.sets">Sets</h2>
        <p id="resultCount">0 resultados</p>
        <div id="setsViewToggle" class="view-toggle" role="group" aria-label="Visualização">
          <button type="button" class="view-toggle-btn" data-grid-view="grid" aria-pressed="true" aria-label="Grade" title="Grade">▦</button>
          <button type="button" class="view-toggle-btn" data-grid-view="list" aria-pressed="false" aria-label="Lista" title="Lista">≣</button>
        </div>
      </section>

      <section id="cardGrid" class="group-grid" data-view="sets" aria-live="polite"></section>
      <p id="emptyState" class="empty-state" data-i18n="empty.sets" hidden>Nenhum set encontrado com esses filtros.</p>
    </main>

    <script defer src="src/i18n.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/app.js"></script>
  </body>
</html>
