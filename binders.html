<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title.binders">Binders - Sleevu</title>
    <meta name="description" content="Monte fichários visuais 2×2, 3×3, 4×4 e 5×5 das suas cartas de Pokémon TCG, organize por páginas e exporte como imagem ou PDF.">
    <link rel="canonical" href="https://sleevu.app/binders">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/binders">
    <meta property="og:title" content="Binders - Sleevu">
    <meta property="og:description" content="Monte fichários visuais 2×2, 3×3, 4×4 e 5×5 das suas cartas de Pokémon TCG, organize por páginas e exporte como imagem ou PDF.">
    <meta property="og:image" content="https://sleevu.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Binders - Sleevu">
    <meta name="twitter:description" content="Monte fichários visuais 2×2, 3×3, 4×4 e 5×5 das suas cartas de Pokémon TCG, organize por páginas e exporte como imagem ou PDF.">
    <meta name="twitter:image" content="https://sleevu.app/og-image.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js" data-catalog="cards,indexes:sets,set-id-map"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" data-i18n-aria="aria.pages" aria-label="Páginas" data-active-page="binders"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>
      <!-- Galeria: criar + lista/grid de binders. O cabeçalho "Binders" mora
           DENTRO dela (2026-09-26): com um binder aberto o título da página é
           o nome dele, no molde da pasta aberta — "Binders" em cima de "Kanto
           Holos" era um título a mais. -->
      <div id="binderGallery">
        <div class="page-head dash-head">
          <div>
            <h1 data-i18n="binders.heading">Binders</h1>
            <p class="page-head-sub" data-i18n="binders.subtitle">Monte fichários visuais das suas cartas, organize em páginas e exporte como imagem ou PDF.</p>
          </div>
          <a href="dashboard" class="serie-back" data-i18n="nav.backDashboard">← Hub</a>
        </div>
        <!-- Fileira de ações da galeria (2026-09-26, no molde da de Pastas):
             "+ Novo binder" à esquerda abre o formulário logo abaixo (fechado
             quando já há binders — ele ocupava meia tela no celular à toa);
             Visualização e Ordenar na ponta direita. -->
        <div class="binder-gallery-controls">
          <button type="button" id="binderNewToggle" class="cta binder-new-toggle" aria-expanded="false" aria-controls="binderCreatePanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span data-i18n="binders.new">Novo binder</span></button>
          <div class="binder-gallery-tools">
            <div class="view-toggle binder-view-toggle" role="group" data-i18n-aria="toolbar.view" aria-label="Visualização">
              <button type="button" data-view="grid" class="view-toggle-btn binder-view-btn" data-i18n-aria="aria.viewGrid" aria-label="Grade" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/></svg></button>
              <button type="button" data-view="list" class="view-toggle-btn binder-view-btn" data-i18n-aria="aria.viewList" aria-label="Lista" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1"/></svg></button>
            </div>
            <label class="binder-sort-label"><span data-i18n="binders.sort">Ordenar</span>
              <select id="binderSort"></select>
            </label>
          </div>
        </div>
        <section class="binder-toolbar" id="binderCreatePanel" data-i18n-aria="aria.newBinder" aria-label="Novo binder" hidden>
          <input id="binderName" type="text" data-i18n-placeholder="binders.namePlaceholder" placeholder="Nome do binder">
          <label class="binder-grid-label"><span data-i18n="binders.template">Template</span>
            <select id="binderTemplate"></select>
          </label>
          <label class="binder-grid-label"><span data-i18n="binders.type">Tipo</span>
            <select id="binderType"></select>
          </label>
          <label class="binder-grid-label"><span data-i18n="binders.grid">Formato</span>
            <select id="binderGrid"></select>
          </label>
          <button id="binderCreate" class="primary" data-i18n="binders.create">Criar binder</button>
        </section>

        <p id="binderEmpty" class="empty-state" data-i18n="binders.empty" hidden>Você ainda não criou nenhum binder. Crie o primeiro acima.</p>
        <section id="binderList" class="binder-gallery" aria-live="polite"></section>
      </div>

      <!-- Detalhe: um binder aberto. O binders.js desenha o cabeçalho (nome +
           "← Binders"), o trilho de resumo e o fichário dentro do
           #binderDetailBody; os dois botões abaixo são ligados UMA vez no load
           e o render os MOVE pra ponta direita do cabeçalho desenhado — o nó é
           o mesmo, então os listeners seguem valendo a cada re-render. -->
      <div id="binderDetail" hidden>
        <div class="binder-head-actions" id="binderHeadActions">
          <button type="button" id="binderShareBtn" class="secondary" data-i18n="binders.share">Compartilhar</button>
          <button type="button" id="binderSaveBtn" class="primary" data-i18n="binders.save">Salvar binder</button>
        </div>
        <section id="binderDetailBody"></section>
      </div>
    </main>

    <script defer src="src/i18n.js"></script>
    <!-- Textos dos binders: fora do i18n.js pra as outras paginas nao carregarem 17 KB a toa. -->
    <script defer src="src/i18n-binders.js"></script>
    <script defer src="src/shared.js"></script>
    <!-- Fichário (src/binder-view.js): o MESMO módulo do modo fichário da
         Coleção, do set e das Pastas. No celular o binder aberto é ele — uma
         página por tela, de lado —, no formato do próprio binder. -->
    <script defer src="src/binder-view.js"></script>
    <script defer src="src/binders.js"></script>
  </body>
</html>
