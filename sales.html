<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title.sales">Vendas e Trocas - Sleevu</title>
    <meta name="description" content="Monte sua lista de cartas à venda ou troca, com preço e condição, e compartilhe com seus grupos.">
    <link rel="canonical" href="https://sleevu.app/sales">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/sales">
    <meta property="og:title" content="Vendas e Trocas - Sleevu">
    <meta property="og:description" content="Monte sua lista de cartas à venda ou troca, com preço e condição, e compartilhe com seus grupos.">
    <meta property="og:image" content="https://sleevu.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Vendas e Trocas - Sleevu">
    <meta name="twitter:description" content="Monte sua lista de cartas à venda ou troca, com preço e condição, e compartilhe com seus grupos.">
    <meta name="twitter:image" content="https://sleevu.app/og-image.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js" data-catalog="cards,indexes:sets,set-id-map"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Saída de emergência: só aparece se o app não subir (ver .falha-boot no styles.css). -->
    <div class="falha-boot" hidden>
      <p data-i18n="boot.stuck">Esta tela não terminou de carregar.</p>
      <a class="primary" href="" data-i18n="boot.retry">Tentar de novo</a>
      <a class="secondary" href="/" data-i18n="boot.home">Ir para o início</a>
    </div>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" data-i18n-aria="aria.pages" aria-label="Páginas" data-active-page="sales"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>
      <!-- Vendas em PASTAS (2026-09-27): a galeria das pastas (sem ?id=) e a
           pasta aberta (?id=) moram no #salesView, que o sales.js monta — no
           molde da Minha Coleção: faixa do título com a busca, o trilho de
           cartões (herói + "Visão geral" + preço em lote) e as cartas. A
           faixa do título é a MESMA nas duas vistas: na pasta, o h1 vira o
           nome editável e o "← Hub" vira "← Vendas e Trocas" (o JS troca), e
           a busca peneira a pasta. Uma busca só, então o initHeaderSearch do
           shared.js continua levando ela pro header no celular. -->
      <div class="page-head dash-head page-head-bar vnd-head">
        <div class="page-head-bar-text">
          <h1 id="salesTitle" data-i18n="nav.sales">Vendas e Trocas</h1>
          <a id="salesBack" href="dashboard" class="serie-back" data-i18n="nav.backDashboard">← Hub</a>
        </div>
        <label class="page-search-label" for="searchInput" data-i18n="search.title">Procurar:</label>
        <section class="page-search">
        <svg class="page-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
        <input id="searchInput" type="search" enterkeyhint="search" data-i18n-placeholder="sales.folders.searchGallery" placeholder="Procurar nas pastas de venda…">
        </section>
      </div>

      <div id="salesView"></div>

      <!-- Histórico de vendas realizadas: de TODAS as pastas, só na galeria. -->
      <section id="soldSection" data-i18n-aria="sales.sold.heading" aria-label="Vendas realizadas" hidden>
        <header class="results-header sold-header">
          <h2 data-i18n="sales.sold.heading">Vendas realizadas</h2>
          <span id="soldSummary" class="sold-summary"></span>
        </header>
        <div id="soldList" class="sold-list"></div>
      </section>
    </main>

    <script defer src="src/i18n.js"></script>
    <!-- Textos das pastas de venda: fora do i18n.js pra as outras páginas não carregarem à toa. -->
    <script defer src="src/i18n-vendas.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/ordenar.js"></script>
    <script defer src="src/sales.js"></script>
  </body>
</html>
