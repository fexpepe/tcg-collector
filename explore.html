<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title.explore">Explorar - Sleevu</title>
    <meta name="description" content="Busca global do Sleevu: encontre qualquer carta de qualquer jogo — Pokémon, Lorcana, One Piece, Naruto e Hunter × Hunter — num lugar só.">
    <link rel="canonical" href="https://sleevu.app/explore">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/explore">
    <meta property="og:title" content="Explorar - Sleevu">
    <meta property="og:description" content="Busca global do Sleevu: encontre qualquer carta de qualquer jogo num lugar só.">
    <meta property="og:image" content="https://sleevu.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Explorar - Sleevu">
    <meta name="twitter:description" content="Busca global do Sleevu: encontre qualquer carta de qualquer jogo num lugar só.">
    <meta name="twitter:image" content="https://sleevu.app/og-image.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js"></script>
    <!-- Página neutra (sessão hub): o game.js não injeta catálogo nenhum, mas o
         de-para de setIds é estático e o fallback de imagem EN precisa dele. -->
    <script src="data/set-id-map.js"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" data-i18n-aria="aria.pages" aria-label="Páginas" data-active-page="explore"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>
      <div class="page-head page-head-bar">
        <div class="page-head-bar-text">
          <h1 data-i18n="nav.explore">Explorar</h1>
        </div>
        <label class="page-search-label" for="exploreSearch" data-i18n="search.title">Procurar:</label>
        <section class="page-search">
        <svg class="page-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
        <input id="exploreSearch" type="search" enterkeyhint="search" data-i18n-placeholder="explore.placeholder" placeholder="Qualquer carta, de qualquer jogo — nome, set, artista, número…">
        </section>
        <!-- Jogo é um <select> ao lado do Ordenar (eram 13 chips ocupando uma
             faixa inteira). As opções são RECONSTRUÍDAS pelo explore.js a
             partir de GAME_SLUGS no boot — jogo novo entra sozinho, mesma
             garantia dos chips antigos; a lista completa vem no HTML só pra
             primeira pintura não mudar de conteúdo (CLS/no-JS).
             Os três moram DENTRO da faixa, na 3a coluna: mesma fileira do
             título e da busca (ver .page-head-bar-tools no styles.css). -->
        <div class="collection-toolbar-actions page-head-bar-tools">
          <div class="sort-select">
            <label for="exploreGameSelect" data-i18n="toolbar.gameFilter">Jogo:</label>
            <select id="exploreGameSelect">
              <option value="all" data-i18n="filter.gameAll">Todos</option>
              <option value="pokemon" data-i18n="filter.gamePokemon">Pokémon</option>
              <option value="lorcana" data-i18n="filter.gameLorcana">Lorcana</option>
              <option value="onepiece" data-i18n="filter.gameOnePiece">One Piece</option>
              <option value="magic" data-i18n="filter.gameMagic">Magic</option>
              <option value="fab" data-i18n="filter.gameFab">Flesh and Blood</option>
              <option value="gundam" data-i18n="filter.gameGundam">Gundam</option>
              <option value="dbfw" data-i18n="filter.gameDbfw">Dragon Ball Fusion</option>
              <option value="ygo" data-i18n="filter.gameYgo">Yu-Gi-Oh!</option>
              <option value="digimon" data-i18n="filter.gameDigimon">Digimon</option>
              <option value="riftbound" data-i18n="filter.gameRiftbound">Riftbound</option>
              <option value="unionarena" data-i18n="filter.gameUnionArena">Union Arena</option>
              <option value="naruto" data-i18n="filter.gameNaruto">Naruto</option>
              <option value="hxh" data-i18n="filter.gameHxh">Hunter × Hunter</option>
            </select>
          </div>
          <div class="sort-select">
            <label for="exploreSortSelect" data-i18n="sort.label">Ordenar:</label>
            <select id="exploreSortSelect">
              <option value="value-desc" data-i18n="sort.valueDesc">Valor (maior → menor)</option>
              <option value="value-asc" data-i18n="sort.valueAsc">Valor (menor → maior)</option>
              <option value="rarity-desc" data-i18n="sort.rarityDesc">Raridade (maior → menor)</option>
              <option value="rarity-asc" data-i18n="sort.rarityAsc">Raridade (menor → maior)</option>
              <option value="release" data-i18n="sort.releaseDate">Lançamento</option>
              <option value="num-asc" data-i18n="sort.numAsc">Nº da carta (menor → maior)</option>
            </select>
          </div>
          <!-- Mesmo liga-desliga de Configurações → "Agrupar versões da carta"
               (ver o chip no cards.html). Religa a grade sem reload. -->
          <div class="sort-select">
            <label for="groupVariantsChip" data-i18n="toolbar.variants">Versões</label>
            <button type="button" id="groupVariantsChip" class="chip" aria-pressed="false" data-i18n="filter.groupVariants" data-i18n-title="settings.groupVariantsDesc" title="Nas listas de cartas e na busca, mostra uma carta só em vez de uma entrada por versão (Normal, Foil, Reverse…). O + abre a carta pra você escolher qual versão adicionar. A Coleção e a Wishlist continuam mostrando cada versão que você tem.">Agrupar</button>
          </div>
        </div>
      </div>

      <section class="results-header" id="exploreResultsHeader" hidden>
        <h2 data-i18n="results.heading.cards">Cartas</h2>
        <p id="exploreResultCount">0 resultados</p>
      </section>

      <p id="exploreIntro" class="empty-state" data-i18n="explore.intro">Pesquise em todos os jogos de uma vez: nome da carta, set, artista ou número (ex.: OP05-119, 忍-1, Pikachu).</p>

      <section id="exploreGrid" class="card-grid" aria-live="polite"></section>
      <p id="exploreEmpty" class="empty-state" data-i18n="explore.empty" hidden>Nenhuma carta encontrada em nenhum jogo. Tente outro nome ou código.</p>
    </main>

    <script defer src="src/i18n.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/explore.js"></script>
  </body>
</html>
