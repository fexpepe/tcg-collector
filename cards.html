<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title.cards">Todas as cartas - Sleevu</title>
    <meta name="description" content="Busque em todo o catálogo de cartas de Pokémon TCG — internacionais, japonesas e chinesas — com filtros de set, idioma e raridade.">
    <link rel="canonical" href="https://sleevu.app/cards">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/cards">
    <meta property="og:title" content="Todas as cartas - Sleevu">
    <meta property="og:description" content="Busque em todo o catálogo de cartas de Pokémon TCG — internacionais, japonesas e chinesas — com filtros de set, idioma e raridade.">
    <meta property="og:image" content="https://sleevu.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Todas as cartas - Sleevu">
    <meta name="twitter:description" content="Busque em todo o catálogo de cartas de Pokémon TCG — internacionais, japonesas e chinesas — com filtros de set, idioma e raridade.">
    <meta name="twitter:image" content="https://sleevu.app/og-image.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js" data-catalog="cards,set-id-map"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" data-i18n-aria="aria.pages" aria-label="Páginas" data-active-page="cards"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>

      <div class="page-head page-head-bar">
        <div class="page-head-bar-text">
          <h1 data-i18n="nav.allCards">Cartas</h1>
        </div>
        <label class="page-search-label" for="searchInput" data-i18n="search.title">Procurar:</label>
        <section class="page-search">
        <svg class="page-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
        <input id="searchInput" type="search" enterkeyhint="search" data-i18n-placeholder="search.placeholder.cards" placeholder="Carta, Pokémon, set, artista, número...">
        </section>
      </div>
      <!-- Preenchido por buildExploreSubnav (shared.js). Vem VAZIO e com a
           altura reservada no CSS pra pagina nao pular quando os chips
           entram — ver .explore-subnav[data-placeholder] no styles.css. -->
      <nav class="explore-subnav chip-filter" data-placeholder data-i18n-aria="nav.explore" aria-label="Explorar"></nav>

      <p class="collection-subtitle" data-i18n="cards.subtitle">Busque em todo o catálogo de cartas, com os filtros de sempre.</p>

      <section class="toolbar" data-i18n-aria="filters.show" aria-label="Filtros">
        <div>
          <label for="setFilter" data-i18n="toolbar.set">Set</label>
          <select id="setFilter">
            <option value="" data-i18n="filter.all.m">Todos</option>
          </select>
        </div>
        <div>
          <label for="languageFilter" data-i18n="toolbar.language">Idioma</label>
          <select id="languageFilter">
            <option value="" data-i18n="filter.all.m">Todos</option>
          </select>
        </div>
        <div>
          <label for="rarityFilter" data-i18n="toolbar.rarity">Raridade</label>
          <select id="rarityFilter">
            <option value="" data-i18n="filter.all.f">Todas</option>
          </select>
        </div>
        <div class="price-range-field">
          <label for="priceMin" data-i18n="toolbar.priceRange">Preço</label>
          <div class="price-range">
            <input id="priceMin" type="text" inputmode="decimal" placeholder="mín" data-i18n-aria="aria.priceMin" aria-label="Preço mínimo">
            <span aria-hidden="true">–</span>
            <input id="priceMax" type="text" inputmode="decimal" placeholder="máx" data-i18n-aria="aria.priceMax" aria-label="Preço máximo">
          </div>
        </div>
        <div class="sort-select">
          <label for="cardsSortSelect" data-i18n="sort.label">Ordenar:</label>
          <select id="cardsSortSelect">
            <option value="value-desc" data-i18n="sort.valueDesc">Valor (maior → menor)</option>
            <option value="value-asc" data-i18n="sort.valueAsc">Valor (menor → maior)</option>
            <option value="num-asc" data-i18n="sort.numAsc">Nº da carta (menor → maior)</option>
            <option value="num-desc" data-i18n="sort.numDesc">Nº da carta (maior → menor)</option>
            <option value="rarity-desc" data-i18n="sort.rarityDesc">Raridade (maior → menor)</option>
            <option value="rarity-asc" data-i18n="sort.rarityAsc">Raridade (menor → maior)</option>
            <option value="release" data-i18n="sort.releaseDate">Lançamento</option>
          </select>
        </div>
        <div class="view-toggle-field">
          <label data-i18n="toolbar.view">Visualização</label>
          <div id="cardsViewToggle" class="view-toggle" role="group" data-i18n-aria="toolbar.view" aria-label="Visualização">
            <button type="button" class="view-toggle-btn" data-grid-view="grid" aria-pressed="true" data-i18n-aria="aria.viewGrid" aria-label="Grade" title="Grade">▦</button>
            <button type="button" class="view-toggle-btn" data-grid-view="list" aria-pressed="false" data-i18n-aria="aria.viewList" aria-label="Lista" title="Lista">≣</button>
            <button type="button" class="view-toggle-btn" data-grid-view="compact" aria-pressed="false" data-i18n-title="view.compact" data-i18n-aria="view.compact" aria-label="Compacta" title="Compacta">☰</button>
          </div>
        </div>
        <!-- O mesmo liga-desliga de Configurações → "Agrupar versões da carta",
             aqui porque é NESTA grade que o efeito aparece. Religa sem reload
             (initGroupVariantsChip no shared.js). -->
        <div class="view-toggle-field">
          <label for="groupVariantsChip" data-i18n="toolbar.variants">Versões</label>
          <button type="button" id="groupVariantsChip" class="chip" aria-pressed="false" data-i18n="filter.groupVariants" data-i18n-title="settings.groupVariantsDesc" title="Nas listas de cartas e na busca, mostra uma carta só em vez de uma entrada por versão (Normal, Foil, Reverse…). O + abre a carta pra você escolher qual versão adicionar. A Coleção e a Wishlist continuam mostrando cada versão que você tem.">Agrupar</button>
        </div>
      </section>

      <p id="cardsIntro" class="empty-state" data-i18n-html="cards.intro">Use a busca ou os filtros acima para encontrar qualquer carta do catálogo.</p>

      <section id="resultsHeader" class="results-header" hidden>
        <h2 data-i18n="results.heading.cards">Cartas</h2>
        <p id="resultCount">0 resultados</p>
      </section>

      <section id="cardGrid" class="card-grid" aria-live="polite"></section>
      <p id="emptyState" class="empty-state" data-i18n="empty.pokedex" hidden>Nenhuma carta encontrada com esses filtros.</p>
    </main>

    <script defer src="src/i18n.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/cards.js"></script>
  </body>
</html>
