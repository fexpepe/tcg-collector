<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title.wishlist">Lista de Desejo - Sleevu</title>
    <meta name="description" content="Sua lista de desejos de Pokémon TCG: as cartas que você quer, por variante, com filtros por Pokémon, set e idioma.">
    <link rel="canonical" href="https://sleevu.app/wishlist">
    <meta property="og:site_name" content="Sleevu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sleevu.app/wishlist">
    <meta property="og:title" content="Lista de Desejo - Sleevu">
    <meta property="og:description" content="Sua lista de desejos de Pokémon TCG: as cartas que você quer, por variante, com filtros por Pokémon, set e idioma.">
    <meta property="og:image" content="https://sleevu.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lista de Desejo - Sleevu">
    <meta name="twitter:description" content="Sua lista de desejos de Pokémon TCG: as cartas que você quer, por variante, com filtros por Pokémon, set e idioma.">
    <meta name="twitter:image" content="https://sleevu.app/og-image.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="preconnect" href="https://assets.tcgdex.net">
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Duas tags com media: o primeiro paint ja acerta a barra do navegador
         pelo tema do SISTEMA. Quando a pessoa ESCOLHE um tema, o applyTheme
         (shared.js) troca por uma tag unica sem media, que vence as duas. -->
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sleevu">
    <script src="src/theme.js"></script>
    <script src="src/game.js" data-catalog="cards,indexes:sets,set-id-map"></script>
    <!-- A fonte só seria descoberta depois de baixar e parsear o styles.css
         (o @font-face mora lá). O preload a coloca na fila junto com o CSS.
         crossorigin é OBRIGATORIO mesmo sendo mesma origem: fonte é sempre
         buscada em modo CORS, e sem o atributo o preload nao casa com a
         requisicao do CSS e o arquivo desce DUAS vezes.
         Só o latin: pt-BR e en cabem inteiros em U+0000-00FF; o latin-ext
         (14 KB) fica sob demanda, como o unicode-range ja define. -->
    <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/">Sleevu</a>
        <nav class="page-nav" aria-label="Páginas" data-active-page="wishlist"></nav>
        <div class="header-actions">
          <select id="languageSwitcher" class="lang-select"></select>
        </div>
      </div>
    </header>

    <main>

      <div class="page-head dash-head page-head-bar">
        <div class="page-head-bar-text">
          <h1 data-i18n="nav.wishlist">Lista de Desejo</h1>
          <a href="dashboard" class="serie-back" data-i18n="nav.backDashboard">← Hub</a>
        </div>
        <label class="page-search-label" for="searchInput" data-i18n="search.title">Procurar:</label>
        <section class="page-search">
        <svg class="page-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
        <input id="searchInput" type="search" enterkeyhint="search" data-i18n-placeholder="search.placeholder.detail" placeholder="Carta, set, artista, número...">
        </section>
      </div>

      <section id="wishDrops" class="wish-drops" aria-label="Quedas de preço na wishlist" hidden></section>

      <!-- Preço-alvo atingido: "me avisa quando chegar a R$X" (alvo por carta). -->
      <section id="wishTargets" class="wish-drops wish-targets" aria-label="Cartas que atingiram o preço-alvo" hidden></section>

      <section id="wishSellers" class="wish-sellers" aria-label="Cartas desejadas à venda por outros colecionadores" hidden></section>

      <div class="collection-toolbar">
        <div id="gameFilter" class="chip-filter game-filter" role="group" aria-label="Jogo">
          <button type="button" class="chip" data-game-filter="all" aria-pressed="true" data-i18n="filter.gameAll">Todos</button>
          <button type="button" class="chip" data-game-filter="pokemon" aria-pressed="false" data-i18n="filter.gamePokemon">Pokémon</button>
          <button type="button" class="chip" data-game-filter="lorcana" aria-pressed="false" data-i18n="filter.gameLorcana">Lorcana</button>
          <button type="button" class="chip" data-game-filter="onepiece" aria-pressed="false" data-i18n="filter.gameOnePiece">One Piece</button>
          <button type="button" class="chip" data-game-filter="naruto" aria-pressed="false" data-i18n="filter.gameNaruto">Naruto</button>
          <button type="button" class="chip" data-game-filter="hxh" aria-pressed="false" data-i18n="filter.gameHxh">Hunter × Hunter</button>
        </div>
      </div>

      <section class="stats-grid" aria-label="Resumo da lista de desejos">
        <article>
          <span id="distinctCount">0</span>
          <p data-i18n="wishlist.stats.distinct">cartas na lista</p>
        </article>
        <article>
          <span id="setsCount">0</span>
          <p data-i18n="wishlist.stats.sets">sets desejados</p>
        </article>
        <article>
          <span id="wishlistValue">—</span>
          <p data-i18n="value.toBuy">Falta (a comprar)</p>
        </article>
      </section>

      <section class="toolbar" aria-label="Filtros">
        <div>
          <label for="pokemonFilter" data-i18n="toolbar.pokemon">Pokémon</label>
          <select id="pokemonFilter">
            <option value="" data-i18n="filter.all.m">Todos</option>
          </select>
        </div>
        <div>
          <label for="setFilter" data-i18n="toolbar.set">Set</label>
          <select id="setFilter">
            <option value="" data-i18n="filter.all.m">Todos</option>
          </select>
        </div>
        <div>
          <label for="languageFilter" data-i18n="toolbar.language">Idioma</label>
          <select id="languageFilter">
            <option value="" data-i18n="filter.all.m">Todos</option>
          </select>
        </div>
        <div class="sort-select">
          <label for="cardsSortSelect" data-i18n="sort.label">Ordenar:</label>
          <select id="cardsSortSelect">
            <option value="value-desc" data-i18n="sort.valueDesc">Valor (maior → menor)</option>
            <option value="value-asc" data-i18n="sort.valueAsc">Valor (menor → maior)</option>
            <option value="num-asc" data-i18n="sort.numAsc">Nº da carta (menor → maior)</option>
            <option value="num-desc" data-i18n="sort.numDesc">Nº da carta (maior → menor)</option>
            <option value="rarity-desc" data-i18n="sort.rarityDesc">Raridade (maior → menor)</option>
            <option value="rarity-asc" data-i18n="sort.rarityAsc">Raridade (menor → maior)</option>
            <option value="release" data-i18n="sort.releaseDate">Lançamento</option>
          </select>
        </div>
        <div class="view-toggle-field">
          <label data-i18n="toolbar.view">Visualização</label>
          <div id="cardsViewToggle" class="view-toggle" role="group" aria-label="Visualização">
            <button type="button" class="view-toggle-btn" data-grid-view="grid" aria-pressed="true" aria-label="Grade" title="Grade">▦</button>
            <button type="button" class="view-toggle-btn" data-grid-view="list" aria-pressed="false" aria-label="Lista" title="Lista">≣</button>
            <button type="button" class="view-toggle-btn" data-grid-view="compact" aria-pressed="false" data-i18n-title="view.compact" aria-label="Compacta" title="Compacta">☰</button>
          </div>
        </div>
      </section>

      <section class="results-header">
        <h2 data-i18n="wishlist.results">Cartas que eu desejo</h2>
        <p id="resultCount">0 resultados</p>
      </section>

      <section id="cardGrid" class="card-grid" aria-live="polite"></section>
      <p id="emptyState" class="empty-state" data-i18n-html="empty.wishlist" hidden>Sua lista de desejos está vazia. <a href="explore">Explore o catálogo</a> e toque no ♡ das cartas que você quer.</p>
    </main>

    <script defer src="src/i18n.js"></script>
    <script defer src="src/shared.js"></script>
    <script defer src="src/wishlist.js"></script>
  </body>
</html>
